services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: llm-vllm
    runtime: nvidia
    environment:
      MODEL_NAME: ${MODEL_NAME:-Qwen/Qwen2.5-14B-Instruct}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-8192}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.85}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-32}
      VLLM_DTYPE: ${VLLM_DTYPE:-auto}
      # awq_marlin / awq / gptq_marlin / gptq; empty = BF16, no quantization
      QUANTIZATION: ${QUANTIZATION:-}
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - ${MODEL_PATH:-../../models/cache}:/models/model:ro
      - ../../serving/vllm/start-vllm.sh:/app/start-vllm.sh:ro
    ports:
      - "8000:8000"
    command: ["/app/start-vllm.sh"]

  gateway:
    build:
      context: ../..
      dockerfile: gateway/Dockerfile
    container_name: llm-gateway
    depends_on:
      - vllm
    environment:
      VLLM_BASE_URL: http://vllm:8000
      GATEWAY_API_KEY: ${GATEWAY_API_KEY:-change-me}
      DEFAULT_MODEL: ${MODEL_NAME:-Qwen/Qwen2.5-14B-Instruct}
      REQUEST_TIMEOUT_SECONDS: ${REQUEST_TIMEOUT_SECONDS:-120}
      STREAM_TIMEOUT_SECONDS: ${STREAM_TIMEOUT_SECONDS:-300}
    ports:
      - "8080:8080"
